    volumes:
      - ${MONO_DIR}/src/interfacing:/ws/src/interfacing
      - ${MONO_DIR}/src/infrastructure/f1tenth_msgs:/ws/src/f1tenth_msgs
      - ${MONO_DIR}/src/infrastructure/wato_lifecycle_manager:/ws/src/wato_lifecycle_manager
      - ${MONO_DIR}/src/wato_test:/ws/src/wato_test
      - ${MONO_DIR}/bags:/ws/bags

