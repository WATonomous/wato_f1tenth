---
services:
  #################### INFRASTRUCTURE SERVICE ####################
  infrastructure_bringup_dev:
    profiles: ["infrastructure_dev"]
    extends:
      file: ${COMPOSE_EXTEND_FILE}
      service: infrastructure_bringup
    build:
      target: develop
      args:
        USERNAME: "${USERNAME}"
        USER_UID: "${SETUID}"
        USER_GID: "${SETGID}"
        CLAUDE_CODE: "${CLAUDE_CODE}"
    image: "${INFRASTRUCTURE_IMAGE:?}:dev_${INFRASTRUCTURE_DEV_TAG}"
    command: sleep infinity
    volumes:
      - ${MONO_DIR}/src/infrastructure:/ws/src/infrastructure
      - ${MONO_DIR}/src/wato_test:/ws/src/wato_test
      - ${MONO_DIR}/src/interfacing/vesc/vesc_msgs:/ws/src/vesc_msgs
      - ${MONO_DIR}/src/wato_msgs:/ws/src/wato_msgs
      - ${MONO_DIR}/bags:/ws/bags

  #################### INTERFACING SERVICE ####################
  interfacing_bringup_dev:
