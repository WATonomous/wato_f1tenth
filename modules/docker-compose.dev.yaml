      - ${MONO_DIR}/maps:/opt/watonomous/maps
      - ${MONO_DIR}/src/world_modeling:/ws/src/world_modeling
      - ${MONO_DIR}/src/wato_msgs:/ws/src/wato_msgs
      - ${MONO_DIR}/src/infrastructure/wato_lifecycle_manager:/ws/src/wato_lifecycle_manager
