---
# No cache_from: these images are only built locally until step 5 publishes them to GHCR, and each
# build tried to pull a cache from there and got 403. The local build cache is used without it.
services:

  #################### INFRASTRUCTURE SERVICES ####################
  infrastructure_source:
    profiles: ["infrastructure_pre"]
    build:
      context: ..
      dockerfile: docker/infrastructure.Dockerfile
      target: source
      args:
        BASE_IMAGE: "${BASE_IMAGE_CPU}"
    image: "${INFRASTRUCTURE_IMAGE:?}:source_${TAG}"

  infrastructure_deps:
    profiles: ["infrastructure_pre"]
    build:
      context: ..
      dockerfile: docker/infrastructure.Dockerfile
      target: dependencies
      args:
        BASE_IMAGE: "${BASE_IMAGE_CPU}"
    image: "${INFRASTRUCTURE_IMAGE:?}:deps_${INFRASTRUCTURE_DEPS_TAG}"

  infrastructure_bringup:
    init: true
    # Stop like Ctrl-C: on SIGTERM ros2 launch exits at once and docker SIGKILLs the nodes, so none
    # shut down cleanly (system_monitor's black box never wrote its clean-shutdown row). On SIGINT
    # launch stops every node and waits for them; docker still kills anything hung after 10 s.
    stop_signal: SIGINT
    ulimits:
      memlock: -1
    ipc: host
    network_mode: host
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      args:
        MODULE_SOURCE: "${INFRASTRUCTURE_IMAGE:?}:source_${TAG}"
        MODULE_DEPS: "${INFRASTRUCTURE_IMAGE:?}:deps_${INFRASTRUCTURE_DEPS_TAG}"
        GIT_BRANCH: "${GIT_BRANCH:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        MONO_DIR: "${MONO_DIR:-unknown}"
      target: deploy
    image: "${INFRASTRUCTURE_IMAGE:?}:${TAG}"
    command: /bin/bash -c "ros2 launch infrastructure_bringup infrastructure.launch.yaml foxglove_port:=${FOXGLOVE_BRIDGE_PORT:?}"
    environment:
      - PLATFORM=${PLATFORM}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ZENOH_ROUTER_CONFIG_URI=${ZENOH_ROUTER_CONFIG_URI}
      - ZENOH_SESSION_CONFIG_URI=${ZENOH_SESSION_CONFIG_URI}

  #################### INTERFACING SERVICE ####################
  interfacing_source:
    profiles: ["interfacing_pre"]
    build:
      context: ..
      dockerfile: docker/interfacing.Dockerfile
      target: source
      args:
        BASE_IMAGE: "${BASE_IMAGE_CPU}"
    image: "${INTERFACING_IMAGE}:source_${TAG}"

  interfacing_deps:
    profiles: ["interfacing_pre"]
    build:
      context: ..
      dockerfile: docker/interfacing.Dockerfile
      target: dependencies
      args:
        BASE_IMAGE: "${BASE_IMAGE_CPU}"
    image: "${INTERFACING_IMAGE}:deps_${INTERFACING_DEPS_TAG}"

  interfacing_bringup:
    init: true
    stop_signal: SIGINT
    ulimits:
      memlock: -1
    ipc: host
    network_mode: host
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      args:
        MODULE_SOURCE: "${INTERFACING_IMAGE}:source_${TAG}"
        MODULE_DEPS: "${INTERFACING_IMAGE}:deps_${INTERFACING_DEPS_TAG}"
        GIT_BRANCH: "${GIT_BRANCH:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        MONO_DIR: "${MONO_DIR:-unknown}"
      target: deploy
    image: "${INTERFACING_IMAGE}:${TAG}"
    command: /bin/bash -c "ros2 launch interfacing_bringup interfacing.launch.yaml"
    environment:
      - PLATFORM=${PLATFORM}
      - MAPPING=${MAPPING}
      - REALSENSE=${REALSENSE}
      - REALSENSE_IMAGES=${REALSENSE_IMAGES}
      - IMU=${IMU}
      - CONTROLLER=${CONTROLLER}
      - LOCAL_PLANNER=${LOCAL_PLANNER}
      - TRACK=${TRACK}
      - DIRECTION=${DIRECTION}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ZENOH_ROUTER_CONFIG_URI=${ZENOH_ROUTER_CONFIG_URI}
      - ZENOH_SESSION_CONFIG_URI=${ZENOH_SESSION_CONFIG_URI}
    # Uncomment to give interfacing access to host hardware (joysticks, CAN, serial):
    # volumes:
    #   - /dev/input:/dev/input
    #   - /run/udev:/run/udev:ro
    # privileged: true
    depends_on:
      infrastructure_bringup:
        condition: service_started
        required: false

  #################### PERCEPTION SERVICE ####################
  perception_source:
    profiles: ["perception_pre"]
    build:
      context: ..
      dockerfile: docker/perception.Dockerfile
      target: source
      args:
        GPU: "${GPU:-nvidia}"
        BASE_IMAGE_CPU: "${BASE_IMAGE_CPU}"
        BASE_IMAGE_AMD64_NVIDIA: "${BASE_IMAGE_AMD64_NVIDIA}"
        BASE_IMAGE_ARM64_NVIDIA: "${BASE_IMAGE_ARM64_NVIDIA}"
    image: "${PERCEPTION_IMAGE:?}:source_${TAG}"

  perception_deps:
