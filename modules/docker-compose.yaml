      args:
        GPU: "${GPU:-nvidia}"
        BASE_IMAGE_CPU: "${BASE_IMAGE_CPU}"
        BASE_IMAGE_AMD64_NVIDIA: "${BASE_IMAGE_AMD64_NVIDIA}"
        BASE_IMAGE_ARM64_NVIDIA: "${BASE_IMAGE_ARM64_NVIDIA}"
    image: "${PERCEPTION_IMAGE:?}:deps_${PERCEPTION_DEPS_TAG}"

  perception_bringup:
    init: true
    stop_signal: SIGINT
    ulimits:
      memlock: -1
    ipc: host
    network_mode: host
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      args:
        MODULE_SOURCE: "${PERCEPTION_IMAGE:?}:source_${TAG}"
        MODULE_DEPS: "${PERCEPTION_IMAGE:?}:deps_${PERCEPTION_DEPS_TAG}"
        GIT_BRANCH: "${GIT_BRANCH:-unknown}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        MONO_DIR: "${MONO_DIR:-unknown}"
      target: deploy
    image: "${PERCEPTION_IMAGE:?}:${TAG}"
    command: /bin/bash -c "ros2 launch perception_bringup perception.launch.yaml"
    volumes:
      - ${MONO_DIR}/models:/opt/watonomous/models
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ZENOH_ROUTER_CONFIG_URI=${ZENOH_ROUTER_CONFIG_URI}
      - ZENOH_SESSION_CONFIG_URI=${ZENOH_SESSION_CONFIG_URI}
    depends_on:
      infrastructure_bringup:
        condition: service_started
        required: false

  #################### WORLD MODELING SERVICE ####################
  world_modeling_source:
    profiles: ["world_modeling_pre"]
    build:
      context: ..
