---
# GPU overlay: added by watod on a PC with GPU=nvidia (see watod_scripts/watod-compose.sh).
# The car gets the Jetson's nvidia runtime from docker-compose.car.yaml instead.
#
# The modules built on the CUDA base (world_modeling, action, perception) get the GPU.
x-gpu: &gpu
  runtime: nvidia
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [gpu]

services:
  world_modeling_bringup: *gpu
  world_modeling_bringup_dev: *gpu
  action_bringup: *gpu
  action_bringup_dev: *gpu
  perception_bringup: *gpu
  perception_bringup_dev: *gpu
