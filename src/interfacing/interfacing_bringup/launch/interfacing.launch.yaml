---
# interfacing.launch.yaml
# Entry point for the interfacing container (see modules/docker-compose.yaml).

launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  # Example node: replace with real interfacing nodes
  - node:
      pkg: "interfacing_example"
      exec: "example_node"
      name: "example_node"
      namespace: "interfacing/example"
      output: "screen"
      param:
        - from: "$(find-pkg-share interfacing_bringup)/config/interfacing.yaml"

  # Lifecycle Manager: add every lifecycle node above to node_names
  - node:
      pkg: "wato_lifecycle_manager"
      exec: "wato_lifecycle_manager_node"
      name: "interfacing_lifecycle_manager"
      namespace: "interfacing"
      output: "screen"
      param:
        - name: "node_names"
          value:
            - /interfacing/example/example_node
        - name: autostart
          value: $(var autostart)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: $(var bond_enabled)
