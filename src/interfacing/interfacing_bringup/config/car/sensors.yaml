urg_node:
  ros__parameters:
    # +-113 deg (the UST covers +-135): past about 114 deg the beams graze the car itself and make
    # a V of false points behind the lidar (scan analysis, 2026-11-11). Widen only after moving
    # whatever sits at +-120 deg next to the lidar.
    angle_max: 1.972
    angle_min: -1.972
    ip_address: "192.168.0.10"
    ip_port: 10940
    # serial_port: "/dev/sensors/hokuyo"
    serial_baud: 115200
    laser_frame_id: "laser"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: true   # /hal/scan carries intensities (reflectivity), for perception and bags
    publish_multiecho: false
    cluster: 1
    skip: 0
