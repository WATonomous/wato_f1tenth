/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 4620.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -0.5635
    steering_angle_to_servo_offset: 0.476

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    # speed command limits in ERPM (4620 ERPM per m/s): 10 m/s forward, 5 m/s reverse.
    # The VESC's own limits (VESC Tool, Motor > General) are +50000 / -30000.
    speed_min: -23250.0
    speed_max: 46200.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

ackermann_to_vesc_node:
  ros__parameters:
    # Speed limiter + launch stall guard + feedforward traction control between the mux and VESC,
    # for every input (autonomy, gamepad, keyboard).
    #
    # Launch blends from launch_accel (2.0 m/s^2) at standstill up to max_accel (3.3 m/s^2) by
    # launch_blend_speed (1.5 m/s). Closed-loop max_speed_lead (0.5 m/s) keeps the commanded ramp
    # from winding up ahead of a stalled sensorless motor; the stall watchdog commands 0 ERPM for
    # stall_reset_duration (0.15 s) if the motor stalls > 0.5 s at >= 20 A to clear VESC PID windup.
    # Friction-circle derating reduces longitudinal accel under lateral cornering load.
    max_accel: 3.3     # m/s^2 top acceleration limit once rolling
    max_decel: 4.0     # m/s^2 slowing down (10 m/s -> 0 in ~2.5 s / 12.5 m)
    launch_accel: 2.0          # m/s^2 gentle launch cap from 0 m/s
    launch_blend_speed: 1.5    # m/s speed where accel finishes blending up to max_accel
    max_speed_lead: 0.5        # m/s max lead ahead of measured wheel speed while accelerating
    grip_accel_limit: 4.5      # m/s^2 combined friction-circle budget (a_x^2 + a_y^2 <= grip^2)
    min_corner_accel: 0.5      # m/s^2 longitudinal accel floor during tight cornering
    wheelbase: 0.3302          # m (matches vesc_to_odom_node)
    high_steer_angle: 0.25     # rad (~14 deg) threshold for low-speed high-steer launch cap
    high_steer_launch_accel: 1.5  # m/s^2 accel cap below launch_blend_speed when steered sharply
    stall_cmd_min_speed: 0.3   # m/s minimum target speed to count as a launch stall
    stall_measured_max_speed: 0.05  # m/s wheel speed below which the motor is considered stalled
    stall_min_motor_current: 20.0   # A motor current confirming the VESC is actively pushing
    stall_detect_time: 0.5     # s continuous stall before commanding 0 ERPM reset
    stall_reset_duration: 0.15 # s 0-ERPM hold to clear VESC m_speed_i_term
    stall_max_retries: 3       # consecutive stall retries before latching stall_fault
    cmd_timeout: 0.5           # s without a command before braking to a stop
    vesc_state_timeout: 0.25   # s before VESC sensors/core telemetry is treated as stale
    limiter_status_topic: "/control/speed_limiter"   # target vs limited speed + TC state for Foxglove

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase is about 25cm
    wheelbase: 0.3302

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec
