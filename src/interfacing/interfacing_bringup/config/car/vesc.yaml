/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 4620.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -0.5635
    steering_angle_to_servo_offset: 0.476

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    # speed command limits in ERPM (4620 ERPM per m/s): 10 m/s forward, 5 m/s reverse.
    # The VESC's own limits (VESC Tool, Motor > General) are +50000 / -30000.
    speed_min: -23250.0
    speed_max: 46200.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

ackermann_to_vesc_node:
  ros__parameters:
    # Speed limiter between the mux and the VESC, for every input (autonomy, gamepad, keyboard).
    # Speeding up at 3.3 m/s^2 (15250 ERPM/s); VESC ground tests launched most smoothly at
    # 2.2 m/s^2 (10000 ERPM/s), so drop back to that if launches stutter. Slowing down at 4.0 m/s^2 stops from 10 m/s in about 2.5 s / 12.5 m. The VESC caps the
    # current braking feeds back into the battery (Battery Current Max Regen, -10 A = 2C for the
    # 5000 mAh pack), so this rate cannot overcharge the pack; at top speed that cap may soften the
    # first moments of braking. The VESC's own speed ramp (25000 ERPM/s, 5.4 m/s^2) sits above both.
    max_accel: 3.3     # m/s^2
    max_decel: 4.0     # m/s^2
    cmd_timeout: 0.5   # s without a command before braking to a stop

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase is about 25cm
    wheelbase: 0.3302

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec
