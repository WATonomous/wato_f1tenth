ackermann_mux:
  ros__parameters:
    topics:
      # TTC emergency brake (safety_node). Off by default (interfacing ebrake:=false);
      # highest priority so it beats manual override once it is enabled.
      emergency:
        topic: /drive/ebreak
        timeout: 0.2
        priority: 100
      joystick:
        topic: /drive/joystick
        timeout: 0.2
        # Highest priority: manual override must beat autonomy. Ties in
        # ackermann_mux are broken by list order, so this must be strictly
        # greater than keyboard/autonomy, not equal.
        priority: 50
      keyboard:
        topic: /drive/keyboard
        timeout: 0.2
        priority: 25
      autonomy:
        topic: /drive/autonomy
        timeout: 0.2
        priority: 25
