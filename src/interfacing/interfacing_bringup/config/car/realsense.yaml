---
# Intel RealSense driver (realsense2_camera). Started with REALSENSE=true or realsense:=true.
# The IMU is what we use: gyro + accel are combined into /camera/camera/imu.
/**:
  ros__parameters:
    # The driver prefixes camera_name ("camera"), so "link" -> camera_link, which interfacing
    # attaches to base_link. "camera_link" here would give camera_camera_link and split the TF tree.
    base_frame_id: link
    # Reset the camera when the driver starts: a D435i whose motion module hit a hardware error
    # ("Motion Module force pause") stays stuck until it is reset or replugged
    initial_reset: true
    enable_gyro: true
    enable_accel: true
    unite_imu_method: 2  # 1 = copy, 2 = linear interpolation
    enable_sync: false
    # Color and depth cost CPU/USB bandwidth: off unless REALSENSE_IMAGES=true (realsense_images:=true
    # in interfacing.launch.yaml turns both on). Record them through image_transport
    # (compressed / zstd).
    enable_depth: false
    enable_color: false
    rgb_camera.color_profile: "640,480,30"
    # Depth tuning (issue #38), measured on the car against 640x480 on a flat wall at ~0.95 m:
    # 848x480 (the D435's native depth resolution) sees much more of the floor just in front of
    # the car (bottom strip 4% -> 45% valid, whole image 86% -> 91%) for ~4% more of one core,
    # and still delivers 30 Hz (interfacing only; not yet checked with the full stack running).
    depth_module.depth_profile: "848,480,30"
    # Temporal filter: averages each pixel over recent frames. Halves depth noise (median
    # 1.4 -> 0.7 mm) without filling holes. Lag on moving edges not yet checked at driving speed.
    # Hole filling stays off: it fills black pixels with guesses (97% "valid", noise doubles).
    temporal_filter.enable: true
    enable_infra1: false
    enable_infra2: false
    pointcloud.enable: false
