ackermann_mux:
  ros__parameters:
    topics:
      emergency:
        topic: /drive/ebreak
        timeout: 0.2
        priority: 100
      joystick:
        topic: /drive/joystick
        timeout: 0.2
        # strictly above keyboard/autonomy: ackermann_mux breaks ties by list order
        priority: 50
      keyboard:
        topic: /drive/keyboard
        timeout: 0.2
        priority: 25
      autonomy:
        topic: /drive/autonomy
        timeout: 0.2
        priority: 25
