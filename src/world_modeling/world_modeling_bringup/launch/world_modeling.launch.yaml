---
# world_modeling.launch.yaml
# Entry point for the world_modeling container (see modules/docker-compose.yaml).

launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  # Example node: replace with real world_modeling nodes
  - node:
      pkg: "world_modeling_example"
      exec: "example_node"
      name: "example_node"
      namespace: "world_modeling/example"
      output: "screen"
      param:
        - from: "$(find-pkg-share world_modeling_bringup)/config/world_modeling.yaml"

  # Lifecycle Manager: add every lifecycle node above to node_names
  - node:
      pkg: "wato_lifecycle_manager"
      exec: "wato_lifecycle_manager_node"
      name: "world_modeling_lifecycle_manager"
      namespace: "world_modeling"
      output: "screen"
      param:
        - name: "node_names"
          value:
            - /world_modeling/example/example_node
        - name: autostart
          value: $(var autostart)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: $(var bond_enabled)
