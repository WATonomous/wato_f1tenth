particle_filter:
  ros__parameters:
    # topic names
    scan_topic: '/hal/scan'
    odometry_topic: '/hal/odom'
    # range data downsampling
    angle_step: 18
    max_particles: 8000
    squash_factor: 2.2
    # visualization: /pf/viz/* topics, set by world_modeling.launch.yaml from PF_VIZ (default off)
    viz: 0
    max_viz_particles: 60
    # ray marching method
    range_method: 'rmgpu'
    theta_discretization: 112
    # range data filtering
    max_range: 10
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    # z_short: weight for returns shorter than the map predicts (people, boxes, and the floor the
    # lidar sees ~3-4 m ahead when the car pitches under braking). At 0.01 the filter trusted every
    # short return and slid the pose backwards in the e7 bottom hallway (2026-11-11 crash analysis);
    # 0.10 treats them as unexplained obstacles. z_hit lowered to keep the sum at 0.95. Under test.
    z_short: 0.10
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.66
    sigma_hit: 8.0
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2

# The map is chosen with world_modeling.launch.yaml's map argument (default wato_office).
