pure_persuit_node:
  ros__parameters:
    global_frame_id: "map"
    local_frame_id: "base_link"
    global_path_topic: "/global_planner/path"
    # Map-frame local path is the controller contract. /local_path is leftover
    # viz/compat (base_link, only correct at publish). Track in map and transform
    # the lookahead point every tick, same pipeline as the global path.
    local_path_topic: "/local_path_map"
    overtake_ready_topic: "/overtake_ready"
    dead_man_active_topic: "/dead_man_switch"
    ackermann_control_topic: "/drive/autonomy"
    odom_topic: "/odom"
    overtake_enable: true
    control_rate_hz: 50.0
    # ~4 planner periods at 30 Hz. /overtake_ready is latched and the planner does
    # not re-assert it on every failure path, so path age is the only honest
    # signal that the local path is still steerable. Past this we drop back to the
    # global line rather than tracking a path planned from a pose we have left.
    # Deliberately loose: this is a fault detector, not a cycle-skip detector, and
    # dropping out of LOCAL_FOLLOW mid-overtake on one late cycle is worse than
    # tracking a path one cycle old.
    local_path_timeout_s: 0.15
    force_dead_man_active: true
    speed_limit_active: true
    speed_limit: 10.0
    max_steering_angle: 0.52
    # steering = kp_gain * 2y/L^2, so kp_gain stands in for the wheelbase (0.33).
    # 0.15 is a deliberately detuned ~half-wheelbase. 0.25 is closer to the
    # geometrically correct value and limit-cycles at ~2 Hz once actuator lag is
    # in the loop -- do NOT raise this for hairpin bite, it adds gain at every
    # speed including the fast regime where it oscillates. Use min_lookahead.
    kp_gain: 0.15
    # L = clamp(max_lookahead * v / lookahead_ratio, min_lookahead, max_lookahead)
    max_lookahead: 2.0 #increase this if there is more lots of ossilation at high speed
    # The hairpin knob. Steering goes as 1/L^2 and L is clamped here below
    # v = lookahead_ratio, so this bites only in the slow regime: 1.0 -> 0.8 is
    # 1.56x more steering in tight corners and no change at speed.
    min_lookahead: 1.0
    lookahead_ratio: 6.0 #this is he speed at which the car will have max look ahead distance
    speed_topic: "/autodrive/roboracer_1/odom"
    enable_debug_vis: false
