state_manager_node:
  ros__parameters:
    state_update_rate: 50.0 # hz the state machine runs grid scan, and state transitions
    overtake_start_distance_m: 3.0 # distance from opponent to start overtake
    side_by_side_distance_m: 0.5 # within 0.5m of the back of the opponent
    merge_start_gap_m: 1.0 # distance from opponent to start merge
    merge_done_gap_m: 2.0 # distance from opponent to end merge
    merge_done_d_m: 0.25 # d-offset to end merge (as defined in frenet frame)

local_frenet_lattice_planner_node:
  ros__parameters:
    horizon_m: 6.0 # length of the path
    layer_spacing_m: 1.0
    lane_spacing_m: 0.2
    max_lateral_offset_m: 2.0
    max_path_angle_deg: 60.0 # max heading deviation from raceline for sampled edge geometry
    sample_spacing_m: 0.1 #basically the resolution of the path
    planner_rate_hz: 50.0 # maximum completion-driven attempt rate
    max_runtime_ms: 9.0 # soft deadline checked immediately after the DP loop
    collision_circle_radius_m: 0.20
    front_collision_circle_offset_m: 0.26
    soft_inflation_distance_m: 0.18
    occupied_threshold: 50
    friction_coeff: 1.0 #yeah this number is completely made up
    min_velocity_mps: 0.0 # ill probably make this 0 at some point
    max_velocity_mps: 5.0 # the dream i guess
    follow_d_weight: 0.9 # pull towards racing line in follow mode
    overtake_d_weight: 0.02 # pull towards racing line in overtake mode
    merge_d_weight: 0.20 # pull towards racing line in merge mode
    merge_terminal_d_weight: 0.0 # punish merge paths that dont return to racing line
    planner_path_frame: "map"
    controller_path_frame: "base_link"
    debug_path_topic: "/local_path_map"
    angle_smoothing_enabled: true
    velocity_smoothing_enabled: true
    velocity_smoothing_max_accel_mps2: 5.0
    velocity_smoothing_max_decel_mps2: 5.0
    steering_command_topic: "/drive/autonomy" # latest pure-pursuit steering command
    steering_command_timeout_s: 0.06 # pure pursuit publishes every 50 ms; allow 10 ms scheduling margin
    wheelbase_m: 0.33 # axle-to-axle distance; calibrate for the physical car
