occupancy_grid_generator:
  ros__parameters:
    # Robot-relative grid extents: +x is forward and +y is left.
    forward_distance: 8.0       # meters in front of base_link
    behind_distance: 1.0        # meters behind base_link
    lateral_half_width: 6.1     # meters to both the left and right
    resolution: 0.10         # meters per cell

    # Frame IDs
    robot_frame: "base_link"

    # Topic names
    scan_topic: "/scan"
    output_topic: "/costmap"

    # Obstacle marking
    obstacle_value: 100     # value for occupied cells (0-100)
    free_value: 0           # value for free cells (0-100)
    unknown_value: -1       # value for unknown cells

    # endpoints inside of the rectangle bounded below are excluded
    self_filter_enabled: true
    self_filter_min_x_m: -0.10 # distance behind base link
    self_filter_max_x_m: 0.42 # distance ahead of base link
    self_filter_half_width_m: 0.25 # distance to left and to right of base link
