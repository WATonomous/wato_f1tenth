occupancy_grid_generator:
  ros__parameters:
    # Grid dimensions and resolution
    grid_width: 20.0        # meters
    grid_height: 20.0       # meters
    resolution: 0.05         # meters per cell

    # Frame IDs
    robot_frame: "base_link"

    # Topic names
    scan_topic: "/scan"
    output_topic: "/costmap"

    # Obstacle marking
    obstacle_value: 100     # value for occupied cells (0-100)
    free_value: 0           # value for free cells (0-100)
    unknown_value: -1       # value for unknown cells

    # Endpoints inside this base_link rectangle are excluded
    self_filter_enabled: true
    self_filter_min_x_m: -0.10 # distance behind base_link
    self_filter_max_x_m: 0.42 # distance ahead of base_link
    self_filter_half_width_m: 0.18 # distance to left and right of base_link
