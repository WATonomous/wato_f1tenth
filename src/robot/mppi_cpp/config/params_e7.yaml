lmppi_node:
  ros__parameters:
    # Startup parameters: read once when the node starts. Restart MPPI after
    # changing these because they affect subscriptions, rollout array shapes,
    # JAX compilation, or the random sampling stream.
    is_sim: false                  # true: /ego_racecar/odom; false: /pf/pose/odom.
    state_predictor: dynamic_ST   # Rollout model. dynamic_ST includes yaw rate/slip; kinematic_ST is simpler.
    n_samples: 8192               # Number of sampled control sequences. More is steadier but slower.
    # Can do higher for low speed and lower for high speed (corresponding to lookahead distance)
    n_steps: 12                    # Rollout horizon length. At dt=0.1, 6 steps = 0.6s lookahead.
    n_iterations: 1               # MPPI update passes per odom callback. Lower if Hz suffers on this Jetson.
    sim_time_step: 0.1            # Rollout integration/control timestep used inside MPPI.
    random_seed: 527787           # Sampling seed. Keep fixed for repeatable tuning runs.
    render: false                 # Race hardware: avoid extra rollout/sync unless debugging trajectories.

    # timer
    control_loop_hz: 40.0

    # Control trigger architecture. 'odom_gate': pose_callback rate-gates and
    # dispatches control_step itself (~30-50 Hz from the PF's pose rate), so
    # the executor cannot starve pose ingestion behind a continuously-ready
    # timer. control_loop_timer becomes a low-rate watchdog that only fires
    # if pose-driven dispatch hasn't run in control_watchdog_max_silence_sec.
    control_trigger_mode: odom_gate              # 'odom_gate' | 'timer'
    control_watchdog_hz: 5.0                      # watchdog timer rate in odom_gate mode
    control_watchdog_max_silence_sec: 0.10        # fire watchdog if pose-driven hasn't run in this long

    # Live param refresh gate. Leave true while tuning on this new map so
    # `ros2 param set` takes effect; flip to false before racing to skip the
    # ~100-param 2 Hz refresh entirely.
    live_tuning_enabled: false

    # Live tuning parameters: mppi_node.get_params() refreshes these on every
    # odometry callback, so they can be changed with ros2 param set.
    temperature: 0.015             # MPPI greediness. Lower = winner-take-all; higher = smoother averaging.
    init_vel: 2.0                 # Minimum speed assumed by the rollout model at startup/very low speed.
    startup_speed: 1.0            # Minimum /drive.speed while measured speed is below init_vel.
    use_pose_delta_state_estimate: true # Real car: estimate vx / yaw-rate from PF pose deltas plus command prior.
    # Fallback friction belief -- used only when the raceline CSV has no per-waypoint
    # friction column (col 10). e7.csv does not carry one, so this scalar is what's
    # actually used for every rollout.
    friction: 0.5

    # Use the MPPI raceline CSV vx_mps column for turn-aware reference spacing.
    use_waypoint_speed_profile: true   # true: use raceline vx_mps; false: use constant ref_vel spacing.
    # e7.csv's vx_mps (copied from e7_fifth_v3_centerline_with_vel.csv) ranges
    # ~1.76-8.41 m/s. Scaled down for the first runs on this map/hardware
    # combination; raise once the car has proven out at this pace.
    speed_profile_scale: 0.4          # Multiplies raceline vx_mps. Raise to push pace; lower for stability.
    speed_profile_min_speed: 1.0       # Lower clamp for reference/profile speed after scaling.
    speed_profile_max_speed: 9.0       # Upper clamp, just above e7.csv's raw max (~8.41 m/s) pre-scale.
    speed_profile_lookahead_steps: 3   # Planning brake lookahead: min speed over current..N future ref steps.
    speed_profile_iterations: 3        # Rebuild reference using profiled speeds this many times; 2-3 is enough.

    # Feedforward from raceline vx_mps to /drive.speed. MPPI still supplies
    # steering; speed comes purely from the MPPI-optimized accel command.
    use_speed_profile_drive_speed: false      # true: blend profile speed into final /drive.speed command.
    speed_profile_drive_lookahead_steps: 0    # Command brake lookahead: which future ref speed drives /drive.speed.

    # MPPI control exploration.
    control_sample_std_steer: 0.8      # Std dev of normalized steering-rate noise. Higher explores sharper turns.
    control_sample_std_accel: 10.0     # Std dev of normalized accel noise. Higher explores harder accel/brake.

    # Physical scale for normalized controls.
    # normalized steer-rate +1 -> +steer_vel_scale rad/s
    # normalized acceleration +1 -> +accel_scale m/s^2
    steer_vel_scale: 2.7               # Converts sampled steering action to steering-rate rad/s.
    accel_scale: 2.7                   # Converts sampled accel action to m/s^2 inside rollouts.

    ######################################################
    ################### Reward weights ###################
    ######################################################
    xy_reward_weight: 0.25              # Main path-tracking term: distance from rollout to reference XY.
    velocity_reward_weight: 0.5        # Penalizes mismatch to reference speed, not raw speed by itself.
    yaw_reward_weight: 0.01             # Penalizes heading mismatch; helps avoid sideways path matches.

    wall_cost_enabled: true
    wall_cost_weight: 10.0
    wall_cost_margin: 0.3
    wall_cost_power: 0.6
    wall_cost_map_yaml: '' # injected by launch (bringup_robot's maps/e7_fifth_v3.yaml)

    # Opponent-aware MPPI cost. No opponent_predictor node is launched
    # alongside this bringup (single-car), so keep this fully disabled
    # rather than relying on opponent_active never going true.
    opponent_path_topic: /opponent/predicted_path
    opponent_cost_enabled: true
    opponent_cost_weight: 20.0
    opponent_cost_radius: 0.4
    opponent_cost_power: 0.4
    opponent_cost_discount: 0.9
    opponent_path_timeout: 0.5

    slip_cost_enabled: false
    slip_cost_weight: 2.0
    slip_cost_beta_safe: 0.4

    latacc_cost_enabled: false
    latacc_cost_weight: 3.0
    latacc_cost_safe: 80.0

    steer_sat_cost_enabled: false
    steer_sat_cost_weight: 0.5
    steer_sat_soft_ratio: 0.85

    # MPPI warm-start watchdog. If comms/timing hiccups or a bad local plan
    # leave the optimizer biased, reset the shifted control sequence instead
    # of carrying that bad plan for many future callbacks.
    mppi_guard_on_timing_jump: true
    mppi_guard_wall_gap: 0.3
    mppi_guard_stamp_gap: 0.3
    mppi_guard_aopt_threshold: 0.98
    mppi_guard_saturation_callbacks: 4
    mppi_guard_bad_callbacks_to_clear_control: 3

    # Pose-delta estimator persistence. Lower prior weights forget a bad
    # vy/wz sample faster; hiccup settings reduce memory after odom dt spikes.
    state_est_vy_prior: 0.4
    state_est_wz_prior: 0.4
    state_est_hiccup_dt: 0.06
    state_est_hiccup_prior_scale: 0.35

    ######################################################
    ###################### BACKEND #######################
    ######################################################
    # Output safety clamps.
    min_speed: 0.0                    # Final /drive.speed lower clamp.
    max_speed: 9.0                    # Final /drive.speed upper clamp, matching speed_profile_max_speed.
    # This car's actual steering limit, matching pure_persuit.yaml's
    # max_steering_angle (bringup_robot/config/pure_persuit/pure_persuit.yaml)
    # rather than the IV-car template's 0.4189.
    max_steering_angle: 0.5

    # RViz visualization. Add MarkerArray displays for these topics:
    # /mppi/reference, /mppi/optimal_trajectory, /mppi/sampled_trajectories
    publish_markers: true             # Needed for rviz to show anything; safe because every publish below is gated on subscriber count + rate-capped + BEST_EFFORT.
    viz_publish_rate_hz: 10.0          # Matches the MD's tested default rather than 10.0 -- keep conservative on first rviz runs.
    marker_frame_id: map
    reference_line_width: 0.06
    optimal_line_width: 0.08
    sampled_line_width: 0.025
    sampled_trajectory_count: 0
    sampled_trajectory_alpha: 0.18
