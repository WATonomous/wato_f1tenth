# stanley_controller (CONTROLLER=stanley), car values. Tuning notes: stanley_controller/README.md.
/**:
  ros__parameters:

    # ---- topics ----
    global_path_topic:       "/global_planner/path"
    dead_man_active_topic:   "/hal/dead_man_switch"
    ackermann_control_topic: "/hal/drive/autonomy"
    odom_topic:              "/hal/localization/odom"  # pose
    speed_topic:             "/hal/odom"               # speed

    # ---- frames ----
    global_frame_id: "map"        # markers + path live here
    local_frame_id:  "base_link"  # drive command frame

    # ---- speed ----
    speed_limit_active: true
    # m/s hard cap. 5.0 since 2026-11-11: at 9 m/s the car brakes hard into the e7 bottom-hallway
    # corner, the nose dives, the lidar sees the floor ahead and localization lags into the wall.
    # Raise only after the lidar is tilted up (or the scan otherwise fixed) and re-tested.
    speed_limit: 5.0
    speed_lookahead_s: 0.4       # s: command the slowest path speed within this much driving ahead (0 = closest waypoint)

    # ---- steering physics ----
    max_steering_angle: 0.52   # rad (~30 deg). Physical limit - don't raise past the car's real max.
    wheelbase:          0.324  # m, front-to-rear axle. Verify against the actual car / URDF.

    # ---- Stanley gains (the main tuning knobs) ----
    # k_h : heading gain - how hard it corrects pointing the wrong way.
    #        understeers / turns too late -> raise.   whips wheel too hard -> lower.
    k_h: 0.95
    # k_e : cross-track gain - how hard it pulls back onto the line.
    #        drifts off and stays off -> raise.   weaves on straights -> lower.
    k_e: 0.7
    # k_soft : low-speed softener in the CTE term.
    #        twitchy at crawl / just after arming -> raise (->1.0).
    #        leave at 0.5 unless you see that specific symptom.
    k_soft: 0.5

    # ---- closest-point search ----
    # window : waypoints searched forward each tick. Bigger for denser paths /
    #          higher speed; too big can jump to the wrong leg of a hairpin.
    #          20 is fine for ~100-150 waypoint tracks.
    closest_point_window: 40
    # recovery_dist : if nearest waypoint in the window is farther than this (m),
    #          do a full re-scan (assumes teleport / localization jump).
    #          Raise if it false-fires mid-corner on a sparse track.
    closest_point_recovery_dist: 2.0

    # ---- safety ----
    pose_timeout_s: 0.5  # s: stop if no localization pose for this long (pose runs at 50 Hz)

    # ---- debug ----
    enable_debug_vis: true   # set false on race day to cut publish overhead
    debug_vis_rate_hz: 20.0  # debug topics publish at most this often

    # ---- loop ----
    control_rate_hz: 50.0     # control loop (Hz); localization runs at 50
