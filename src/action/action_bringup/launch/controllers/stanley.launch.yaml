# Stanley: follows /global_planner/path (heading + cross-track error at the front axle), and
# /local_planner/path while the local planner holds /local_planner/active true (only when
# LOCAL_PLANNER is set).

launch:
  - arg: {name: platform}
  - arg: {name: config_dir}
  - arg: {name: local_planner, default: "none"}

  - node:
      pkg: stanley_controller
      exec: stanley_controller
      name: stanley_controller_node
      output: screen
      param:
        - from: "$(var config_dir)/stanley_controller.yaml"
        - name: use_local_planner
          value: "$(eval '\"$(var local_planner)\" != \"none\"')"
