---
# action.launch.yaml
# Entry point for the action container (see modules/docker-compose.yaml).
#
# controller:=pure_pursuit (default) runs pure pursuit with config/<platform>/pure_pursuit.yaml.
# controller:=mppi starts mppi_cpp's e7 launch. MPPI is untested on Jazzy until the JAX image step.

launch:
  - arg:
      name: platform
      default: "$(env PLATFORM sim)"
      description: "car or sim"

  - arg:
      name: controller
      default: "$(env CONTROLLER pure_pursuit)"
      description: "pure_pursuit, mppi or none"

  - node:
      if: "$(eval '\"$(var controller)\" == \"pure_pursuit\"')"
      pkg: pure_pursuit
      exec: pure_pursuit_node
      name: pure_pursuit_node
      output: screen
      param:
        - from: "$(find-pkg-share action_bringup)/config/$(var platform)/pure_pursuit.yaml"

  - include:
      if: "$(eval '\"$(var controller)\" == \"mppi\"')"
      file: "$(find-pkg-share mppi_cpp)/launch/e7.launch.py"
