launch:
  # Launch arguments
  - arg:
      name: foxglove_port
      default: "8765"
      description: "Port for Foxglove WebSocket server"

  - arg:
      name: foxglove_address
      default: "0.0.0.0"
      description: "Address for Foxglove WebSocket server"

  - arg:
      name: platform
      default: "$(env PLATFORM sim)"
      description: "car or sim: picks config/<platform>/system_monitor.yaml"

  # Computer health (/system/status), pack power (/system/power) and, on the car, the black box
  - node:
      pkg: system_monitor
      exec: system_monitor_node
      name: system_monitor
      output: screen
      param:
        - from: "$(find-pkg-share infrastructure_bringup)/config/$(var platform)/system_monitor.yaml"

  # TF Relay (workaround for Foxglove tf issues)
  - node:
      pkg: topic_tools
      exec: relay
      name: tf_relay
      output: screen
      args: /tf /tf_new

  # TF Static Relay (workaround for bag split losing static transforms)
  - node:
      pkg: tf_static_relay
      exec: tf_static_relay
      name: tf_static_relay
      output: screen

  # Foxglove Bridge
  - node:
      pkg: foxglove_bridge
      exec: foxglove_bridge
      name: foxglove_bridge
      output: screen
      param:
        - name: port
          value: $(var foxglove_port)
        - name: address
          value: $(var foxglove_address)
        - name: send_buffer_limit
          value: 100000000
        - name: use_sim_time
          value: false
